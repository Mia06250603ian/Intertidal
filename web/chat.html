<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f9f9f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#20201f" media="(prefers-color-scheme: dark)">
<title>Claude</title>

<link rel="icon" href="icons/favicon-64.png?v=3" sizes="64x64" type="image/png">
<link rel="icon" href="icons/favicon.ico?v=3" sizes="any">
<!-- ?v= 是给 iOS 用的：主屏图标一旦加过就会被长期缓存，
     换了图不换 URL 的话，删掉重新添加也可能还是旧那张。换图时把版本号 +1。 -->
<link rel="apple-touch-icon" href="icons/icon-180.png?v=3">
<link rel="manifest" href="manifest.json?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Claude">
<!-- ⚠️ 别改成 black-translucent。改过一次（2026-08-16），后果是输入框浮到半空：
     内容延伸到状态栏底下后，window.innerHeight 与 visualViewport.height 差出一个
     状态栏的高度，而键盘检测正是拿这个差值判断的（见 fitKeyboard 的 kbGap），
     于是误判成"键盘开着"，把输入卡往上顶。
     深色模式下顶上那条白边是这个值造成的，但它只是难看；输入框跑位是不能用。 -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- 装在外壳 iframe 里时,把外壳量到的安全区递进来(2026-10-10,所有者报「顶部分层」)。
     ⚠️ iOS 不把刘海 / Home 条的高度传进 iframe:框里 env(safe-area-inset-*) 恒为 0。
     原来外壳只好在框上面空出一截纯色带当状态栏,内容滑不过去,看着就是上下两层。
     现在外壳让框铺满整屏,这里从外壳(同源)量出真实安全区,写成 --dw-sat / --dw-sab;
     下面凡用安全区的地方都写成 var(--dw-sat, env(...)) —— **单独打开本页时没有这两个变量,
     退回 env(),和改之前逐像素相同**(官端那套不动)。外壳转屏 / 改尺寸时会再递一次。
     ⚠️ 写在 <style> 之前:首次绘制前就要有值,不然顶栏先画在刘海底下再跳下来。 -->
<script>
(function () {
  try {
    if (window.parent === window) return;
    var pd = parent.document, probe = pd.createElement("div");
    probe.style.cssText = "position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;" +
      "padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)";
    (pd.body || pd.documentElement).appendChild(probe);
    var c = parent.getComputedStyle(probe), r = document.documentElement.style;
    r.setProperty("--dw-sat", c.paddingTop);
    r.setProperty("--dw-sab", c.paddingBottom);
    probe.remove();
  } catch (e) {}
})();
</script>
<script>
/* 夜间模式：跟随系统 / 常亮 / 常暗，三态轮换，记在本地。
   写在 <style> 前面执行，页面还没画就把皮穿好，不会闪一下白的。
   规矩：反转的只有底色、卡片、线、字这些"纸和墨"；
   本家橘、身体粉这种有身份的颜色两种模式下都不动——它们是记号，不是背景。 */
(function () {
  try {
    var t = localStorage.getItem('homeTheme') || 'auto';
    if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
  } catch (e) {}
})();
</script>
<style>
  :root {
    --bg: #f9f9f6;
    --card: #ffffff;
    /* 2026-08-16：不另外推导新值，直接用所有者已经定好的那两支——
       按钮底/弹窗条 = 她的气泡色，描边 = 她的包边色。
       这样整套浅色只有她亲自调出来的四个值，不掺我算的。 */
    --panel: #f1f1ed;
    /* 中性色照官端 token 表（claude.com 线上 CSS 的 --theme-* 角色）：
       line = border-tertiary，text = foreground-primary，dim = foreground-tertiary。
       原来的 #e8e5dc 比官方 #e8e6dc 差一位十六进制，多半是当年手抄错了一个字符。 */
    --line: #ecece6;
    --text: #141413;
    --dim: #5e5d59;
    --think: #87867f;   /* 官方 --color-gray-500 */
    /* 赤陶统一成一支（2026-08-16）：原来按钮 #c96442、花 #e1734f 是两个颜色，
       所有者要求统一。#e1734f 是她在校准尺上调的那支。 */
    --accent: #e1734f;
    --accent-soft: #e1734f;
    /* 菊花的颜色。8/16 起和 --accent 同为 #e1734f（所有者要求赤陶只有一支），
       token 保留是为了将来想让花和按钮分开时，改这一行就够。 */
    --spark: #e1734f;
    --user-bubble: #f1f1ed;
    /* 气泡包边：0.5px 在 3 倍屏上约 1.5 个物理像素。深色下不画（设 transparent）。 */
    --bubble-ring: #ecece6;
    --sage: #96B08F;          
    --sage-track: #E7EDE2;
    --pink-track: #F8E5DE;
    --green: #2e7d43;
    --red: #c0392b;
    --amber: #e3a13a;         
    --amber-track: #f5e6c8;
    --red-track: #f6d8d4;
    --overlay: rgba(40, 38, 34, .4);
    /* 官端衬线是 Copernicus（Anthropic 自家授权字体，拿不到也不能内嵌）。
       iOS 自带的 New York（ui-serif）是最接近的免费替代——先它，
       中文没覆盖再落回 Songti SC。数字仍走 SerifNum。 */
    --serif: SerifNum, ui-serif, "New York", Georgia, "Songti SC", "Noto Serif SC", serif;
    --glass: color-mix(in srgb, var(--card) 70%, transparent);  /* 悬浮层玻璃度（顶栏/菜单——内容条 8/3 改用 --panel 实色） */
    --pink: #E5A192;          
  }
  @media (prefers-color-scheme: dark) {
html:not([data-theme="light"]) {
      /* 底色照官端深色三层灰：gray-950 页面底 / gray-800 卡片 / gray-750 内容条。
         来源是 claude.com 线上 CSS 的 --theme-background-* 角色表。
         原来这三层取的是 800/750/(383836)，整体亮了两级，所以「和官端不一样」。 */
      /* 深色只用所有者定的那两支：底色 #20201f、气泡 #131312，不再自己发明中间值。
           --card  = 底色：输入框/卡片的面不比页面亮，靠那圈内描边区分（官端就是这样）
           --panel = 气泡色：弹窗分组卡、按钮，都是「凹进去」的那一层 */
      --bg: #20201f; --card: #20201f; --panel: #131312; --line: #3d3d3a;
      --text: #faf9f5; --dim: #a3a099; --think: #9c9a92; --user-bubble: #131312; --bubble-ring: transparent;
      --sage: #A8C0A0; --sage-track: #3A423A; --pink-track: #4A3B34;
      --green: #6fbf85; --red: #e07a6a;
      --amber: #e8b45c; --amber-track: #4a4232; --red-track: #4d3a36;
      --overlay: rgba(0, 0, 0, .55);
    }
}
html[data-theme="dark"] {
      /* 深色只用所有者定的那两支：底色 #20201f、气泡 #131312，不再自己发明中间值。
           --card  = 底色：输入框/卡片的面不比页面亮，靠那圈内描边区分（官端就是这样）
           --panel = 气泡色：弹窗分组卡、按钮，都是「凹进去」的那一层 */
      --bg: #20201f; --card: #20201f; --panel: #131312; --line: #3d3d3a;
      --text: #faf9f5; --dim: #a3a099; --think: #9c9a92; --user-bubble: #131312; --bubble-ring: transparent;
      --sage: #A8C0A0; --sage-track: #3A423A; --pink-track: #4A3B34;
      --green: #6fbf85; --red: #e07a6a;
      --amber: #e8b45c; --amber-track: #4a4232; --red-track: #4d3a36;
      --overlay: rgba(0, 0, 0, .55);
    }
  
  @font-face {
    font-family: SerifNum;
    src: local("Helvetica Neue"), local("Helvetica");
    unicode-range: U+0030-0039, U+002F, U+002E, U+003A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    overflow-x: hidden; max-width: 100vw;   
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.7;   /* 2026-09-10 校准尺定：正文 16 → 15；行高不动 */
    font-variant-numeric: tabular-nums;   
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }

  .ic { display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .ic svg { width: 100%; height: 100%; display: block; }

  #toastLane {
    position: fixed; z-index: 400; left: 10px; right: 10px;
    top: calc(var(--dw-sat, env(safe-area-inset-top)) + 8px);
    display: flex; flex-direction: column; gap: 8px; pointer-events: none;
  }
  
  #doingLine { display: none; margin: 0 auto 7px; max-width: 720px;
    pointer-events: none; }
  #doingLine.on { display: flex; }
  #doingLine .pill { display: inline-flex; align-items: center; gap: 8px;
    max-width: 100%; padding: 7px 14px; border-radius: 999px;
    font-size: 14px; color: var(--dim); font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden;
    background: var(--glass);
    -webkit-backdrop-filter: blur(20px) saturate(1.7);
    backdrop-filter: blur(20px) saturate(1.7);
    box-shadow: 0 2px 14px rgba(0,0,0,.07), inset 0 0 0 1px rgba(255,255,255,.5); }
  
  #doingLine .w { font-weight: 600; color: var(--accent); overflow: hidden;
    text-overflow: ellipsis; }
  #doingLine .en { color: var(--accent); opacity: .55; font-size: 12px;
    font-weight: 600; flex: none; }
  #doingLine .t { flex: none; color: var(--dim); }
  #doingLine .t { opacity: .75; }

  .toast {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 14px 13px 16px; border-radius: 20px;
    pointer-events: auto; cursor: pointer;
    transform: translateY(-140%); opacity: 0;
    transition: transform .42s cubic-bezier(.22,1.1,.36,1), opacity .28s ease;
  }
  .toast.in { transform: translateY(0); opacity: 1; }
  .toast .ti { flex: none; width: 22px; height: 22px; color: var(--dim); }
  .toast .ti svg { width: 100%; height: 100%; stroke-width: 1.8; }
  .toast .tx { flex: 1; min-width: 0; }
  .toast .t1 { font-size: 14.5px; font-weight: 700; line-height: 1.35; }
  .toast .t2 { font-size: 13px; color: var(--dim); line-height: 1.45; margin-top: 1px;
    word-break: break-word; }
  .toast .tx-close { flex: none; width: 26px; height: 26px; color: var(--dim); opacity: .7; }
  .toast .tx-close svg { width: 100%; height: 100%; stroke-width: 1.8; }

  .glass,
  .composer, #nkPop, .nk-say, .board-toggle, .menuCard, .crow, .songcard {
    
    background: var(--glass);
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--card) 76%, transparent),
      color-mix(in srgb, var(--card) 58%, transparent));
    -webkit-backdrop-filter: blur(24px) saturate(1.9) brightness(1.04);
    backdrop-filter: blur(24px) saturate(1.9) brightness(1.04);
    border: 0;
    box-shadow:
      0 10px 34px rgba(0,0,0,.09),              /* 外阴影：浮起来 */
      0 1px 3px rgba(0,0,0,.05),                /* 贴地那道近影 */
      inset 0 1px 0 rgba(255,255,255,.92),      /* 顶部内高光：上边缘那道光 */
      inset 0 -7px 18px rgba(255,255,255,.34),  /* 底部内反光：光打在下沿的回弹 */
      inset 0 0 0 1px rgba(255,255,255,.44);    /* 一圈细描边：厚度的轮廓 */
  }
  @media (prefers-color-scheme: dark) {
html:not([data-theme="light"]) .glass,
    html:not([data-theme="light"]) .songcard,
    html:not([data-theme="light"]) .composer,
    html:not([data-theme="light"]) #nkPop,
    html:not([data-theme="light"]) .nk-say,
    html:not([data-theme="light"]) .board-toggle,
    html:not([data-theme="light"]) .menuCard,
    html:not([data-theme="light"]) .crow {
      background: var(--glass);
      background: linear-gradient(180deg,
        color-mix(in srgb, var(--card) 74%, transparent),
        color-mix(in srgb, var(--card) 56%, transparent));
      box-shadow:
        0 12px 38px rgba(0,0,0,.42),
        0 1px 3px rgba(0,0,0,.3),
        inset 0 1px 0 rgba(255,255,255,.16),
        inset 0 -7px 18px rgba(255,255,255,.045),
        inset 0 0 0 1px rgba(255,255,255,.09);
    }
}
html[data-theme="dark"] .glass,
  html[data-theme="dark"] .songcard,
  html[data-theme="dark"] .composer,
  html[data-theme="dark"] #nkPop,
  html[data-theme="dark"] .nk-say,
  html[data-theme="dark"] .board-toggle,
  html[data-theme="dark"] .menuCard,
  html[data-theme="dark"] .crow {
      background: var(--glass);
      background: linear-gradient(180deg,
        color-mix(in srgb, var(--card) 74%, transparent),
        color-mix(in srgb, var(--card) 56%, transparent));
      box-shadow:
        0 12px 38px rgba(0,0,0,.42),
        0 1px 3px rgba(0,0,0,.3),
        inset 0 1px 0 rgba(255,255,255,.16),
        inset 0 -7px 18px rgba(255,255,255,.045),
        inset 0 0 0 1px rgba(255,255,255,.09);
    }

  /* ============ 顶栏（悬浮玻璃，消息从底下滑过去） ============ */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    padding: 8px 12px 20px; padding-top: calc(8px + var(--dw-sat, env(safe-area-inset-top)));
    display: flex; align-items: center; gap: 8px;
    background: transparent;
    pointer-events: none;
  }
  header > * { pointer-events: auto; }
  /* 渐隐这层挪到伪元素上：原来 mask 挂在 header 上，会把两颗按钮一起吃掉一半 */
  header::before {
    content: ''; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(to bottom,
      color-mix(in srgb, var(--bg) 88%, transparent) 0%,
      color-mix(in srgb, var(--bg) 55%, transparent) 55%,
      transparent 100%);
    -webkit-backdrop-filter: blur(10px) saturate(1.3);
    backdrop-filter: blur(10px) saturate(1.3);
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 52%, transparent 100%);
    mask-image: linear-gradient(to bottom, #000 0%, #000 52%, transparent 100%);
  }
  .iconbtn {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex: none; color: var(--text);
  }
  .iconbtn .ic { width: 18px; height: 18px; }
  
  header .iconbtn.glass {
    background: transparent;
    border: none; box-shadow: none;
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
  /* 标题留在 DOM 里（改名/更新还在读它），只是照官端不显示 */
  .title { display: none; }
  .title h1 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.3; }
  .title .sub { font-size: 12px; color: var(--dim); line-height: 1.2; }

  /* 照官端：左边一颗玻璃圆，右边一颗玻璃胶囊装两个键。
     「玻璃」不是只靠模糊——是模糊 + 半透明底 + 上缘一道高光 + 一点外投影，四样一起才像。 */
  #menuBtn, .headpill {
    background: color-mix(in srgb, var(--card) 62%, transparent);
    -webkit-backdrop-filter: blur(22px) saturate(1.9);
    backdrop-filter: blur(22px) saturate(1.9);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.55),
      inset 0 0 0 1px color-mix(in srgb, var(--line) 70%, transparent),
      0 2px 10px rgba(0,0,0,.07);
  }
  /* 深色下不能拿 --card 当底——它比背景还闷，玻璃就沉进去了。
     官端是「浮起来」的：一层很淡的白罩 + 白描边，所以看着比底色亮。 */
  @media (prefers-color-scheme: dark) {
    html:not([data-theme="light"]) #menuBtn,
    html:not([data-theme="light"]) .headpill {
      background: rgba(255,255,255,.08);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.14),
        inset 0 0 0 1px rgba(255,255,255,.10),
        0 2px 14px rgba(0,0,0,.40);
    }
  }
  html[data-theme="dark"] #menuBtn, html[data-theme="dark"] .headpill,
  html[data-theme="black"] #menuBtn, html[data-theme="black"] .headpill {
    background: rgba(255,255,255,.08);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.14),
      inset 0 0 0 1px rgba(255,255,255,.10),
      0 2px 14px rgba(0,0,0,.40);
  }
  .headpill {
    margin-left: auto; display: flex; align-items: center; gap: 0;
    padding: 2px 4px; border-radius: 999px;
  }
  .headpill .iconbtn { width: 34px; height: 34px; }
  .headpill .iconbtn .ic { width: 19px; height: 19px; }
  .headpill .iconbtn:active, #menuBtn:active { opacity: .55; }

  /* ============ 消息流 ============ */
  
  #log {
    flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
    padding: calc(76px + var(--dw-sat, env(safe-area-inset-top))) 18px 150px;
    display: flex; flex-direction: column; gap: 16px;   /* 2026-09-10 校准尺定：消息间距 18 → 16 */
  }
  /* 顶上那颗「看更早的」——老账都在，按一下捞 400 行 */
  #olderBtn {
    align-self: center; border: none; cursor: pointer;
    background: rgba(128,128,128,.12); color: inherit; opacity: .72;
    font-size: 13px; padding: 6px 16px; border-radius: 14px;
  }
  .row { width: 100%; max-width: 720px; margin: 0 auto; }
  .row.me { display: flex; justify-content: flex-end; }
  .bubble {
    background: var(--user-bubble); border-radius: 23px; padding: 10px 16px;   /* 2026-09-10 校准尺定：圆角 18 → 23 */
    max-width: 85%; white-space: pre-wrap; word-break: break-word;
    box-shadow: inset 0 0 0 .5px var(--bubble-ring, transparent);
  }
  .gu { white-space: pre-wrap; word-break: break-word; }

  /* 回复下面那排操作按钮（2026-08-16 新增，照官端那排的形制）。
     这轮只有「复制」——朗读/赞/踩/重试在 dwell 里没有对应功能，
     摆上去按了没反应比不摆更难受，所以先不摆。要加时往 .acts 里追加即可。 */
  .acts { display: flex; gap: 2px; margin: 6px 0 2px; }
  .acts button {
    width: 34px; height: 34px; border-radius: 9px; border: 0; background: none;
    /* 和 thinking 那行同一个官方灰(--color-gray-500 #87867f)。
       原来用 --dim(#5e5d59 = 官方 gray-600),深了一档。 */
    color: var(--think); display: flex; align-items: center; justify-content: center;
    transition: background .15s ease, color .15s ease;
  }
  .acts button .ic { width: 18px; height: 18px; }
  .acts button:active { background: var(--panel); color: var(--text); }
  .acts button.done { color: var(--accent); }
  @media (hover: hover) { .acts button:hover { background: var(--panel); color: var(--text); } }
  .gu img.chatimg, .bubble img.chatimg {
    max-width: min(240px, 70%); border-radius: 14px; display: block; margin: 6px 0;
  }
  
  .mdh { font-family: var(--serif); font-weight: 700; line-height: 1.4; margin: 10px 0 6px; }
  .mdh1 { font-size: 27px; }
  .mdh2 { font-size: 22px; }
  .mdh3 { font-size: 18.5px; }
  
  .gu strong, .bubble strong { font-weight: 700; }
  .gu s, .bubble s { opacity: .55; }
  .mdcode {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .9em; padding: 1px 5px; border-radius: 5px;
    background: rgba(128,128,128,.15);
  }
  
  .cbk { margin: 10px 0; border-radius: 16px; overflow: hidden;
    background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
  .cbk-h { display: flex; align-items: center; gap: 2px;
    padding: 9px 10px 8px 15px; box-shadow: inset 0 -1px 0 var(--line); }
  .cbk-h .lang { flex: 1; min-width: 0; font-size: 12.5px; color: var(--dim);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* ============ 弹层 ============ */
  /* 弹窗动画（2026-08-16 重做）

       · 遮罩淡入淡出
       · 抽屉从屏幕外整个推上来（不是挪 24px）

     缓动用 cubic-bezier(.32,.72,0,1)：起步快、收尾稳，就是 iOS 抽屉那种手感。

  .sheetWrap {

    display: flex; align-items: flex-end; justify-content: center;
    visibility: hidden; pointer-events: none;
    transition: visibility 0s linear .34s;

  .sheetWrap.page .grabber { margin-top: calc(10px + var(--dw-sat, env(safe-area-inset-top))); }

  /* 上拉展开（2026-08-16）：官端的抽屉能往上拽满屏，我们原来只能往下拽着关，
     往上被限死在 34px。往上拖过阈值就加 .tall，高度过渡到满屏；
     再往下拖一次先收回半屏，第二次才关——和 iOS 抽屉的两段式一致。 */
  .sheet.tall { height: 100dvh; max-height: 100dvh; border-radius: 0; }
  .sheet.tall .grabber { margin-top: calc(10px + var(--dw-sat, env(safe-area-inset-top))); }
  .sheet { transition: transform .34s cubic-bezier(.32,.72,0,1),
                       height .3s cubic-bezier(.32,.72,0,1),
                       max-height .3s cubic-bezier(.32,.72,0,1); }
  .sheet .head {
    flex: none; display: flex; align-items: center; padding: 16px 16px 12px;
  }
  .sheet .head .hbtn {   
    width: 46px; height: 46px; flex: none; color: inherit;   /* 官端那颗更大一圈 */
    display: flex; align-items: center; justify-content: center;
    /* 官端那个关闭键是个浮起来的圆钮，不是光秃一个叉 */
    background: var(--card); border-radius: 50%;
    /* 加一圈细边：深色下 --card 和弹窗面同色，没这圈边圆钮就看不见了（官端那个也是有边的） */
    box-shadow: 0 1px 3px rgba(0,0,0,.10), inset 0 0 0 1px var(--line);
  }
  .sheet .head .hbtn:active { background: var(--panel); }
  .sheet .head .hbtn .ic { width: 21px; height: 21px; }
  .sheet .head .ht { flex: 1; text-align: center; font-size: 18px; font-weight: 600; padding: 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet .head .hspace { width: 46px; flex: none; }
  .sheet .body { flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 6px 20px calc(20px + var(--dw-sab, env(safe-area-inset-bottom))); }

  .group-label { font-size: 14.5px; color: var(--dim); padding: 14px 4px 8px; }
  .group { background: var(--panel); border-radius: 18px; overflow: hidden; }
  .group .grow {
    display: flex; align-items: center; gap: 13px; width: 100%;

  }
  .group .grow + .grow { border-top: 1px solid var(--line); }
  .group .grow .ic { width: 20px; height: 20px; color: var(--text); }
  .group .grow .val { margin-left: auto; color: var(--dim); font-size: 15px; }
  .group .grow .chev { color: var(--dim); font-size: 14px; }

  /* Usage */
  .ucard { background: var(--panel); border-radius: 18px; padding: 18px 20px; }

  /* 选模型 / Effort / More models */
  /* 弹窗排版：所有者在校准尺上调的（2026-08-16）——
     名字 15px / 描述 12px / 行距 1.35 / 上下留白 16px，每行落在 70px。

  .mrow { display: block; width: 100%; text-align: left; padding: 16px 18px; }

  /* 全屏房间开着时，聊天的顶栏和输入卡先退场——毛玻璃层在个别浏览器里会钻上来 */
  body:has(.sheetWrap.open) header, body:has(.sheetWrap.open) footer { visibility: hidden; }

  /* 搜索 */
  .fd-bar { display: flex; align-items: center; gap: 10px; background: var(--panel); border-radius: 14px; padding: 11px 15px; }
  .fd-bar .ic { width: 17px; height: 17px; color: var(--dim); flex: none; }

  .fd-hint { font-size: 13px; color: var(--dim); padding: 12px 4px; line-height: 1.8; }

  .fd-hit .fs { font-size: 14.5px; line-height: 1.7; word-break: break-word; }

  .cal-head { position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 2px 0 14px; }
  .cal-head .cm { font-size: 18px; font-weight: 600; min-width: 145px; text-align: center; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  .cal-head .cnav { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: .55; }
  .cal-head .cnav .ic { width: 14px; height: 14px; }
  .cal-head .ctoday {   
    position: absolute; right: 0; top: 4px;
    font-size: 12.5px; color: var(--dim); padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px;
  }
  
  .cal-week {
    display: grid; grid-template-columns: repeat(7, 1fr);
    font-size: 10.5px; letter-spacing: .12em; color: var(--dim);
    text-align: center; padding-bottom: 10px;
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 6px; }
  .cal-day {
    position: relative; aspect-ratio: 1 / 1.15;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 15px; background: transparent;
  }
  .cal-day.other { opacity: .22; }
  .cal-day .dnum {
    width: 38px; height: 38px; border-radius: 50%;   
    display: flex; align-items: center; justify-content: center;
    font-variant-numeric: tabular-nums;      /* 1 和 31 一样宽，列才齐 */
    transition: background .18s;
  }
  
  .cal-day.sel .dnum { background: color-mix(in srgb, var(--dim) 30%, transparent); }
  
  .cal-day.today .dnum { background: var(--accent); color: #fff; }  /* 今天=这一屏唯一的一粒橘 */
  .cal-day .dnum, .cal-day .dots { position: relative; z-index: 1; }
  .cal-day .dots { display: flex; gap: 3px; height: 4px; margin-top: 3px; }
  .cal-day .dots i { width: 4px; height: 4px; border-radius: 50%; }
  .cal-day .dots .dr { background: var(--dim); }
  .cal-day .dots .ds { background: var(--text); }
  /* 详情区：日期是节标，每件事是一根圆角玻璃条 */
  .cal-detail { margin-top: 20px; }
  .cal-dt { font-size: 12px; color: var(--dim); letter-spacing: .12em;
    padding: 0 4px 10px; font-variant-numeric: tabular-nums; }
  .cal-ev { display: flex; align-items: center; gap: 10px; padding: 12px 15px;
    font-size: 15px; margin-bottom: 9px; border-radius: 15px;
    background: var(--panel); }
  .cal-ev .et { flex: 1; min-width: 0; }
  .cal-ev .em { font-size: 12.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .cal-ev .star { color: var(--pink); width: 16px; height: 16px; }
  .cal-ev .edel { color: var(--dim); width: 17px; height: 17px; opacity: .5; }
  .cal-plus { display: flex; align-items: center; gap: 8px; padding: 12px 15px;

  .cal-plus .ic { width: 14px; height: 14px; }
  .cal-add { display: none; border-radius: 15px; padding: 14px 15px 12px; margin-bottom: 9px;
    background: var(--panel); }
  .cal-add.open { display: block; }
  .cal-add input[type=text] {
    width: 100%; border: 0; outline: 0; background: transparent; color: var(--text);
    font: inherit; font-size: 15.5px; padding: 2px 0 10px;
  }
  .cal-add .row2 { display: flex; align-items: center; gap: 8px; font-size: 12.5px;
    color: var(--dim); flex-wrap: wrap; }
  .cal-add input[type=time] {
    border: 0; border-radius: 999px; padding: 6px 12px;
    background: var(--panel); color: var(--text); font: inherit; font-size: 12.5px;
    font-variant-numeric: tabular-nums; -webkit-appearance: none; appearance: none;
  }
  .cal-add .go { margin-left: auto; background: var(--text); color: var(--bg);
    border: 0; border-radius: 999px; padding: 8px 20px; font-size: 13px; font-weight: 500; }
  .pcard { margin-top: 14px; border-radius: 15px; padding: 14px 15px 10px;
    background: var(--panel); }
    .pcard .pt { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 7px; padding-bottom: 6px; }
  .pcard .pt .ic { width: 14px; height: 14px; color: var(--pink); }
  /* 一行一件事，左边名目右边内容——跟小票的表头一个排法 */
  .prow { display: flex; align-items: center; padding: 11px 0; font-size: 14.5px; }
  .prow + .prow { border-top: 1px solid var(--line); }
  .prow .pk { color: var(--dim); font-size: 13.5px; letter-spacing: .08em; }
  .prow .pv { margin-left: auto; display: flex; align-items: center; gap: 16px; }
  /* 强度：亮几个就是几分，粉的 */
  .pv .lv { width: 19px; height: 19px; color: var(--pink); opacity: .25; }
  .pv .lv.on { opacity: 1; }
  .pv .lv svg { fill: currentColor; stroke: none; }
  .pv .gap { gap: 11px; display: flex; align-items: center; }
  /* 心情：一排小脸，选中的粉起来 */
  .pv .face { width: 25px; height: 25px; color: var(--dim); opacity: .45; }
  .pv .face.on { color: var(--pink); opacity: 1; }
  .pv .face svg { stroke-width: 1.7; }
  /* 来没来：iOS 那种开关 */
  .psw {
    width: 46px; height: 27px; border-radius: 999px; flex: none;
    background: color-mix(in srgb, var(--dim) 32%, transparent);
    position: relative; transition: background .22s;
  }
  .psw.on { background: var(--pink); }
  .psw::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 21px; height: 21px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.22);
    transition: transform .22s;
  }
  .psw.on::after { transform: translateX(19px); }
  .pnote { width: 100%; border: 0; background: transparent; color: var(--text); font: inherit; font-size: 14.5px; padding: 0; outline: 0; }
  .plock { font-size: 11.5px; color: var(--dim); margin-top: 8px; }

  /* 身体间(8/3 完整版,鼠尾草的岗):sage 总览卡 + 分组卡 + 大数值行 */
  
  /* 比原版再放开一点：让花撑出卡片的内边距（svg overflow 是 visible，标签不会被切）。
     算过：最外那个标签离中心 140/310，撑到 412px 宽时是 186px，
     屏幕中线 215 → 最远 401，离屏幕边还有 29px 余量 */
  
  .drive-flower { touch-action: manipulation; width: 100%; display: block; overflow: visible; }
  @keyframes petal-sway { 0%, 100% { transform: rotate(-1.3deg); } 50% { transform: rotate(1.3deg); } }
  
  .sw { width: 46px; height: 28px; border-radius: 999px; background: var(--line);
    flex: none; position: relative; transition: background .28s; margin-left: auto; }
  .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px;
    border-radius: 999px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.18);
    transition: transform .28s cubic-bezier(.34,1.4,.5,1); }
  .sw.on { background: var(--sage); }
  .sw.on::after { transform: translateX(18px); }
  .sw.wait { opacity: .45; }
  .grow .val + .sw { margin-left: 10px; }

  /* --tone 挂在整页上，不能挂在 SVG 里那个 g 上——挂在 g 上，
     底下的按钮在 SVG 外面，继承不到，选中的按钮就成了没底色的光杆 */
  
  @keyframes bdFloat  { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-11px); } }
  @keyframes bdBreath { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.14); } }
  
  @media (prefers-color-scheme: dark) {
    html:not([data-theme="light"]) .bd-nums .xc-row .xc-fill.lv0 { background: #55554F; }
    html:not([data-theme="light"]) .bd-nums .xc-row .xc-fill.lv1 { background: #6A6963; }
    html:not([data-theme="light"]) .bd-nums .xc-row .xc-fill.lv2 { background: #8F8E88; }
    html:not([data-theme="light"]) .bd-nums .xc-row .xc-fill.lv3 { background: #B3B0A4; }
    html:not([data-theme="light"]) .bd-nums .xc-row .xc-fill.lv4 { background: #DCDAD2; }
    html:not([data-theme="light"]) .bd-nums .xc-row .xc-fill.lv5 { background: var(--text); }
  }
  
  @keyframes bdGrow { from { transform: scaleX(0); } }
  
  @media (prefers-reduced-motion: reduce) {
    
  }

/* ══ 官端那条:菊花 + 两行英文 ═══════════════════════════════════
   它不是固定在输入框上方,而是跟着对话走 —— 挂在最后一条 AI 回复的下面,
   还没开始聊的时候不出现。由脚本插进 #log 的末尾。 */
.brandline {
  /* width:100% 不能省:#log 是纵向 flex,只写 margin:auto 会让它按内容收缩再居中。
     这一行和 dwell 自己的 .row 保持一致,所以左右边界和消息对齐。 */
  width: 100%; max-width: 720px; margin: 2px auto 6px;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
}
.brandline .spark { width: 30px; height: 30px; flex: none; color: var(--spark); }
.brandline .spark svg { width: 100%; height: 100%; display: block; overflow: visible;
                        shape-rendering: geometricPrecision; }
/* 照官端:浅色模式近黑、深色模式近白 —— 直接跟 --text 走,两种主题自动反过来 */
.brandline .brandnote {
  text-align: right; color: var(--text); opacity: .92;
  font-size: 13px; line-height: 1.45; padding-top: 2px; letter-spacing: .1px;
}
@media (max-width: 420px) { .brandline .brandnote { font-size: 12px; } }

/* 模型胶囊里的思考档位：照官端，跟在模型名后面、灰一档 */
/* 档位跟在模型名后面。
   ⚠️ `.pill` 是 flex 且带 `gap: 6px`，所以真实间隔 = flex 的 gap + 这里的 margin。
   我一开始只改 margin（6→4），实际只从 12px 变成 10px，肉眼根本看不出来
   （2026-08-16 所有者直接问「你改了吗」）。
   现在把这颗胶囊的 flex gap 归零，间隔就完全由下面这一个数说了算 —— 想调只调它。 */
#modelPill { gap: 0; }
.pill .pill-eff { color: var(--dim); margin-left: 5px; }

/* 他正在想/正在说的时候，只留跳动的菊花，那句英文不出来（官端就是这样）。
   用 visibility 而不是 display，位置提前占住，说完浮现时不会把版面顶一下。 */
.brandline .brandnote { transition: opacity .28s ease; }
.brandline.busy .brandnote { opacity: 0; visibility: hidden; }

/* 花瓣:先转到自己的轴上,只缩长度,再转回去 —— 宽度不跟着缩,短了才不显胖 */
.spark .rot, .spark .sp { transform-box: view-box; }
.spark .rot { animation: sparkSpin 6s linear infinite; animation-play-state: paused; }
@keyframes sparkSpin { to { rotate: 360deg; } }

/* 思考:12 片同相位,一起收一起放,不转 */
.spark.think .sp { animation: sparkBloom 1.8s ease-in-out infinite; }
@keyframes sparkBloom { 0%,100% { scale: .04 .3 } 50% { scale: 1 1 } }

/* 流式:窄凹口顺时针跑,整体也在转 */
.spark.out .rot { animation-play-state: running; }
.spark.out .sp {
  animation: sparkNotch 1.9s cubic-bezier(.45,0,.55,1) infinite;
  animation-delay: calc(var(--i) * 1.9s / 12);
}
@keyframes sparkNotch {
  0%, 48%  { scale: 1 1 }
  60%      { scale: .72 .82 }
  72%      { scale: .25 .5 }
  84%      { scale: .72 .82 }
  96%,100% { scale: 1 1 }
}
@media (prefers-reduced-motion: reduce) {
  .spark .rot, .spark .sp { animation-duration: 14s !important; }
}

/* 麦克风:浅底深字,和 + 号同一族 */
#micBtn { width: 38px; height: 38px; border-radius: 999px; border: 0; flex: none;
          background: var(--panel); color: var(--text);
          display: grid; place-items: center; cursor: pointer; }
#micBtn .ic { width: 18px; height: 18px; }

/* 发送键改成官端那种:浅色模式深底白箭头,深色模式反过来。
   用 --text / --bg 两个令牌换位,两种主题都自动对。 */
#send { background: var(--text) !important; color: var(--bg) !important; }
#send.stop { background: var(--panel) !important; }
#send.stop::after { background: var(--text); }

/* ══ 底色 ═══════════════════════════════════════════════════════
   调冷那一版撤了——官端本身就是暖奶油底(#faf9f5 / #262624),
   文件开头 :root 那套就是官端的值,这里不再覆盖。 */

/* ══ 纯黑模式(OLED)═══════════════════════════════════════════
   html[data-theme="black"] 打开。真黑底,灰阶跟着官端走暖,不掺蓝。 */
html[data-theme="black"] {
  --bg:#000000; --card:#0F0F0E; --panel:#1A1A18; --line:#262624;
  --text:#F5F4EF; --dim:#8F8C85; --think:#9c9a92; --user-bubble:#1C1C1A; --bubble-ring:transparent;
  --overlay:rgba(0,0,0,.7);
  --glass:color-mix(in srgb, var(--card) 78%, transparent);
}

   ② 流式时内容长得快，两次检查之间可能就长过了 90px 的判定线，
      于是它以为"用户往上翻了"、当场不跟了（所有者报的"不自动滚"）。
   改成:只有用户**自己**往上翻才松手，翻回底部就重新跟上。 */
var stickBottom = true;
log.addEventListener('scroll', function () {
  /* 2026-10-12:视口刚变(键盘弹起 / 收起、面板互换)、TG 那段还没处理那次 resize 时,别拿变化后的尺寸改「贴不贴底」——
     之前排队的滚动事件晚到一拍就会算成「不在底部」,于是不跟着滚,最后一条被输入框挡住(本地实测三次里两次)。 */
  if (window.__dwVH && window.__dwVH !== window.innerHeight) return;
  /* 再一条(同日):**只有她自己动手往上翻才算「不贴底」**。排版、加载历史、拆泡、尺寸变化这些程序自己引起的滚动,
     只能把它改成「贴底」,不能改成「不贴底」—— 原来任何滚动事件都能改,于是总有某个时刻被误记成「不在底部」,
     之后新消息不自动跟、键盘弹起最后一条被挡(本地实测刚打开聊天页约一半概率)。 */
  if (log.scrollHeight - log.scrollTop - log.clientHeight < 120) stickBottom = true;

let toastLane = null;
function toast(title, body, icon, sticky) {
  if (!toastLane) {
    toastLane = document.createElement('div');
    toastLane.id = 'toastLane';
    document.body.appendChild(toastLane);
  }
  const el = document.createElement('div');
  el.className = 'toast glass';
  const ic = document.createElement('span');
  ic.className = 'ti';
  ic.innerHTML = ICONS[icon] || ICONS.bell || '';
  const tx = document.createElement('div');
  tx.className = 'tx';

  t1.className = 't1'; t1.textContent = title;
  tx.appendChild(t1);
  const t2 = document.createElement('div');
  t2.className = 't2'; t2.textContent = body || '';
  if (!body) t2.style.display = 'none';
  tx.appendChild(t2);
  el._t2 = t2;
  const x = document.createElement('span');
  x.className = 'tx-close'; x.innerHTML = ICONS.x || '';
  el.append(ic, tx, x);
  toastLane.appendChild(el);
  while (toastLane.children.length > 3) toastLane.firstChild.remove();
  requestAnimationFrame(() => el.classList.add('in'));
  const away = () => {
    el.classList.remove('in');
    setTimeout(() => el.remove(), 460);
  };
  el._away = away;
  /* sticky：搬大文件那种要一直改进度的，不能 4 秒就自己走 */
  if (sticky) {
    el.onclick = away;
  } else {
    const t = setTimeout(away, 4200);
    el.onclick = () => { clearTimeout(t); away(); };
  }
  return el;
}

function toastSplit(text) {
  const t = String(text == null ? '' : text)
    .replace(/^[（(]/, '').replace(/[）)]$/, '').trim();
  const i = t.indexOf('，');
  return i > 0 ? [t.slice(0, i), t.slice(i + 1)] : [t, ''];
}

/* 说话里夹的料——图（表情包、照片链接）变成真的图，行首 # 变成大字 */
const IMG_RE = /!\[[^\]]*\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s"'<>]+?\.(?:png|jpe?g|gif|webp)(?:\?[^\s"'<>]*)?)/gi;
const H_RE = /^(#{1,3})\s+(.*)$/;
/* 行内的重音：**粗** `码` ~~划掉~~。全用 createElement 拼，不碰 innerHTML */
const INLINE_RE = /\*\*([^\n]+?)\*\*|`([^`\n]+?)`|~~([^\n]+?)~~/g;
function appendInline(el, text, streaming) {
  let tail = null;
  if (streaming) {
    const marks = [['**', 'strong'], ['`', 'code'], ['~~', 's']];
    for (const [mk, tag] of marks) {
      const n = text.split(mk).length - 1;
      if (n % 2) {
        const i = text.lastIndexOf(mk);
        tail = { text: text.slice(i + mk.length), tag };
        text = text.slice(0, i);
        break;
      }
    }
    const cutLone = (s) => (s.endsWith('*') && !s.endsWith('**') ? s.slice(0, -1) : s);
    if (tail) tail.text = cutLone(tail.text);
    else text = cutLone(text);
  }
  INLINE_RE.lastIndex = 0;
  let last = 0, m;
  while ((m = INLINE_RE.exec(text))) {
    if (m.index > last) el.append(text.slice(last, m.index));
    let node;
    if (m[1] !== undefined) { node = document.createElement('strong'); node.textContent = m[1]; }
    else if (m[2] !== undefined) { node = document.createElement('code'); node.className = 'mdcode'; node.textContent = m[2]; }
    else { node = document.createElement('s'); node.textContent = m[3]; }
    el.appendChild(node);
    last = m.index + m[0].length;
  }
  if (last < text.length) el.append(text.slice(last));
  if (tail && tail.text) {
    const node = document.createElement(tail.tag);
    if (tail.tag === 'code') node.className = 'mdcode';
    node.textContent = tail.text;
    el.appendChild(node);
  }
}

const ORPHAN_TAIL = /(?:\n\n\S)+$/;

function trimOrphanTail(el) {
  const raw = el._raw != null ? el._raw : el.textContent;
  el._final = true;               // 这一轮完了，这条消息定稿，谁都别再画它
  const m = raw && raw.match(ORPHAN_TAIL);
  if (!m) return;
  el._raw = raw.slice(0, raw.length - m[0].length);
  el.textContent = el._raw;
  el.removeAttribute('data-rich');
  renderRich(el);
}

const STREAM_FILE_TAIL = /(?:https?:\/\/[^\s"'<>]*)?\/?a(?:p(?:i(?:\/(?:f(?:i(?:l(?:e(?:\?(?:n(?:a(?:m(?:e(?:=[^\s"'<>]*)?)?)?)?)?)?)?)?)?)?)?)?)?$/;

/* 说到一半的歌链接：这条比文件那条更要紧。
   `…song?id=1146` 写到这儿，正则里的 \d+ 已经能匹配了——它会当场
   渲染出一张**指错歌**的卡片，然后跳成另一首。所以流式的时候
   结尾那个还没写完的链接一律藏住，定稿再变卡片。 */
const STREAM_SONG_TAIL = /https?:\/\/(?:[a-z0-9.]*music[a-z0-9.]*|[a-z]{1,6})(?:\/[^\s]*)?$/i;

/* 流式重绘：攒着原文，每帧重画一次（rAF 合并，别一个 token 排一次版） */
function paintStream(el) {
  if (el._final || el._painting) return;
  el._painting = true;
  requestAnimationFrame(() => {
    el._painting = false;
    // 定稿的那份是权威。刷新网页时几百条事件在一个循环里跑完，rAF 排在最后面才轮到——
    // 不拦这一下，它会把已经画好的卡片、加粗、摘干净的孤尾全冲回流式那版。
    if (el._final || !el.isConnected) return;
    el.textContent = '';
    // 流式时也压着孤尾：真有下文的话，下一帧就补齐了，只差一帧；
    const t = (el._raw || '').replace(ORPHAN_TAIL, '')
      .replace(STREAM_FILE_TAIL, '').replace(STREAM_SONG_TAIL, '');
    appendWithImages(el, t, true);
  });
}

const FILE_RE = /(?:https?:\/\/[^\s"'<>]*)?\/?api\/file\?name=([^\s"'<>&`*，。！？；：、（）【】「」『』]+)/g;
// 英文标点贴在名字屁股上时摘掉；句点不摘，那是扩展名
const NAME_TAIL = /[,!?;:)\]}]+$/;

function fileName(raw) {
  const name = String(raw || '').replace(NAME_TAIL, '');
  let show = name;
  try { show = decodeURIComponent(name); } catch (e) {}
  return { name, show };
}

function appendFileCard(el, raw) {
  const { name, show } = fileName(raw);
  const a = document.createElement('a');
  a.className = 'filecard';
  a.href = 'api/file?name=' + encodeURIComponent(show);
  a.download = show;
  a.appendChild(icEl('filePlus', 17));
  const s = document.createElement('span');
  s.textContent = show;
  a.appendChild(s);
  // 改成自己把文件抓回来做成 blob 再存——页面一动不动，聊天还在原地
  a.addEventListener('click', async (e) => {
    e.preventDefault();
    if (a._busy) return;
    a._busy = true;
    const old = s.textContent;
    s.textContent = old + ' · 拿着…';
    try {
      const r = await fetch(a.href, { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status === 404 ? '柜子里没这个文件' : '拿不到（' + r.status + '）');
      const url = URL.createObjectURL(await r.blob());
      const t = document.createElement('a');
      t.href = url; t.download = show;
      document.body.appendChild(t); t.click(); t.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      s.textContent = old;
    } catch (err) {
      s.textContent = old + ' · ' + (err.message || '出岔子了');
      setTimeout(() => { s.textContent = old; }, 4000);
    }
    a._busy = false;
  });
  el.appendChild(a);
}

function appendWithImages(el, text, streaming) {
  SONG_RE.lastIndex = 0;
  if (SONG_RE.test(text)) {
    const re = new RegExp(SONG_RE.source, 'g');
    let cur = 0, sm;
    while ((sm = re.exec(text))) {
      if (sm.index > cur) appendWithImages(el, text.slice(cur, sm.index), streaming);
      appendSongCard(el, sm[1]);
      cur = sm.index + sm[0].length;
    }
    if (cur < text.length) appendWithImages(el, text.slice(cur), streaming);
    return;
  }
  // 再把文件链接摘出来做成卡片，剩下的照旧走图片和行内标记
  FILE_RE.lastIndex = 0;
  if (FILE_RE.test(text)) {
    // 自己的正则实例：下面要递归，共用全局 lastIndex 会被里层重置成 0，外层就永远绕不出去
    const re = new RegExp(FILE_RE.source, 'g');
    let cur = 0, fm;
    while ((fm = re.exec(text))) {
      if (fm.index > cur) appendWithImages(el, text.slice(cur, fm.index), streaming);
      appendFileCard(el, fm[1]);
      const eaten = fm[1].length - fm[1].replace(NAME_TAIL, '').length;
      cur = fm.index + fm[0].length - eaten;
    }
    if (cur < text.length) appendWithImages(el, text.slice(cur), streaming);
    return;
  }
  IMG_RE.lastIndex = 0;
  let last = 0, m;
  while ((m = IMG_RE.exec(text))) {
    if (m.index > last) appendInline(el, text.slice(last, m.index), streaming);
    const img = document.createElement('img');
    img.src = m[1] || m[2];
    img.className = 'chatimg';
    img.loading = 'lazy';
    img.onload = () => scroll();
    el.appendChild(img);
    last = m.index + m[0].length;
  }
  if (last < text.length) appendInline(el, text.slice(last), streaming);
}
const FENCE_RE = /```([^\n`]*)\n([\s\S]*?)```/g;

function appendCodeBlock(el, lang, code) {
  el.appendChild(buildCodeBlock(lang, code));
}

function buildCodeBlock(lang, code, isFull) {
  const box = document.createElement('div');
  box.className = isFull ? 'cbk cbk-full' : 'cbk';
  const head = document.createElement('div');
  head.className = 'cbk-h';
  const nm = document.createElement('span');
  nm.className = 'lang';
  nm.textContent = (lang || '').trim() || 'Code';

  const cp = document.createElement('button');
  cp.innerHTML = ICONS.copy;
  cp.title = '复制';
  cp.onclick = () => {
    const ok = () => {
      cp.innerHTML = ICONS.check; cp.classList.add('done');
      setTimeout(() => { cp.innerHTML = ICONS.copy; cp.classList.remove('done'); }, 1600);
    };
    if (navigator.clipboard) navigator.clipboard.writeText(code).then(ok).catch(() => {});
    else {
      const t = document.createElement('textarea');
      t.value = code; t.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); ok(); } catch (e) {}
      document.body.removeChild(t);
    }
  };

  const ex = document.createElement('button');
  ex.innerHTML = isFull ? ICONS.x : ICONS.expand;
  ex.title = isFull ? '收起' : '展开';
  ex.onclick = () => {
    if (isFull) { box.remove(); return; }
    const full = buildCodeBlock(lang, code, true);
    document.body.appendChild(full);
  };

  head.append(nm, cp, ex);
  const pre = document.createElement('pre');
  const cd = document.createElement('code');
  cd.textContent = code.replace(/\n$/, '');
  pre.appendChild(cd);
  box.append(head, pre);
  return box;
}

function renderRich(el) {
  if (!el || el.dataset.rich) return;
  // 流式那条路把标记边走边吃掉了，textContent 里已经没有原文——认 _raw
  const text = el._raw != null ? el._raw : el.textContent;
  FENCE_RE.lastIndex = 0;
  if (FENCE_RE.test(text)) {
    /* 有代码块：切成「文本 / 代码块 / 文本 …」，文本那几段还走原来那条路 */
    el.textContent = '';
    FENCE_RE.lastIndex = 0;
    let last = 0, m;
    while ((m = FENCE_RE.exec(text))) {
      if (m.index > last) renderPlainInto(el, text.slice(last, m.index));
      appendCodeBlock(el, m[1], m[2]);
      last = m.index + m[0].length;
    }
    if (last < text.length) renderPlainInto(el, text.slice(last));
    if (!el.innerHTML && text) el.textContent = text;   // 同一条兜底：宁可少一次排版
    el.dataset.rich = '1';
    return;
  }
  renderPlainInto(el, text, true);
  el.dataset.rich = '1';
  ensureActs(el);
}

/* 定稿的回复下面挂一排操作按钮。renderRich 是历史回放和实时流共同的收尾点，
   所以挂这一处就够；未定稿（还在吐字）的不挂，免得中途蹦出来。 */
function ensureActs(el) {
  if (!el || !el.classList.contains('gu') || !el._final) return;
  const row = el.parentElement;
  if (!row || row.querySelector(':scope > .acts')) return;
  const txt = (el._raw != null ? el._raw : el.textContent) || '';
  if (!txt.trim()) return;

  const bar = document.createElement('div');
  bar.className = 'acts';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.title = '复制';
  btn.setAttribute('aria-label', '复制这条回复');
  btn.appendChild(icEl('copy', 18));
  btn.onclick = async () => {
    const t = (el._raw != null ? el._raw : el.textContent) || '';
    let ok = true;
    try { await navigator.clipboard.writeText(t); }
    catch (e) {                       // 非 HTTPS 或旧 Safari 没有剪贴板接口，退回老办法
      try {
        const ta = document.createElement('textarea');
        ta.value = t; ta.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(ta); ta.select();
        ok = document.execCommand('copy'); ta.remove();
      } catch (e2) { ok = false; }
    }
    if (!ok) { note('（复制没成功，长按选中再复制吧）', 'err'); return; }
    btn.classList.add('done');
    btn.innerHTML = ''; btn.appendChild(icEl('check', 18));
    setTimeout(() => {
      btn.classList.remove('done');
      btn.innerHTML = ''; btn.appendChild(icEl('copy', 18));
    }, 1400);
  };
  bar.appendChild(btn);

  /* 分享（官端第二颗）。这颗**是真能用的**：iOS/安卓的系统分享面板。
     没有 navigator.share 的浏览器（多数桌面）就退回复制，并说清楚。 */
  {
    const sb = document.createElement('button');
    sb.type = 'button';
    sb.title = '分享';
    sb.setAttribute('aria-label', '分享这条回复');
    sb.appendChild(icEl('share', 18));
    sb.onclick = async () => {
      const txt = (el._raw != null ? el._raw : el.textContent) || '';
      if (navigator.share) {
        try { await navigator.share({ text: txt }); } catch (e) { /* 用户自己取消，不当错处理 */ }
        return;
      }
      try { await navigator.clipboard.writeText(txt); note('（这台设备没有系统分享，已经复制了）'); }
      catch { note('（分享和复制都没成，长按选中吧）', 'err'); }
    };
    bar.appendChild(sb);
  }

  /* 其余四颗：所有者要求「先全摆上，样子对就行，功能以后加」（2026-08-16）。
     它们现在只有样子，点了会说一句实话，不会假装做了事。
     以后要接，各自缺的东西是：
       play      → 朗读，需要 TTS（前端目前零语音能力，见交接文档）
       thumbUp   → 赞，需要一个存反馈的地方（后端或本地）
       thumbDown → 踩，同上
       refresh   → 重试，需要一个「重新生成上一条」的后端接口，现有 38 个接口里没有 */
  [['play', '朗读'], ['thumbUp', '赞'], ['thumbDown', '踩'], ['refresh', '重试']]
    .forEach(([ic, label]) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.title = label;
      b.setAttribute('aria-label', label);
      b.dataset.todo = '1';            // 标记：还没接功能
      b.appendChild(icEl(ic, 18));
      b.onclick = () => note('（' + label + '还没接，先摆着）');
      bar.appendChild(b);
    });

  row.appendChild(bar);
}

/* 原来 renderRich 的身子拆出来单用——代码块之间的那些文本还要走它。
   有一处坑：这个身子第一句是 `el.textContent = ''`（原来它独占整个气泡，
   清空是对的）。拆出来之后一条消息里会调它好几次，第二次一清空
   就把前面already渲染好的代码块连同文本一起抹了——实测出来的现象是
   气泡里只剩最后一段。所以非独占的时候让它渲染到一个临时 span 里，
   渲染完再挂上去，函数体一个字都不用改。 */
function renderPlainInto(host, text, whole) {
  const el = whole ? host : document.createElement('span');
  IMG_RE.lastIndex = 0;
  const hasImg = IMG_RE.test(text);
  const hasH = /^#{1,3}\s+/m.test(text);
  INLINE_RE.lastIndex = 0;
  const hasInline = INLINE_RE.test(text);
  FILE_RE.lastIndex = 0;
  const hasFile = FILE_RE.test(text);
  SONG_RE.lastIndex = 0;
  const hasSong = SONG_RE.test(text);
  if (!hasImg && !hasH && !hasInline && !hasFile && !hasSong) {
    if (!whole) { el.append(text); host.appendChild(el); }
    return;
  }
  el.textContent = '';
  const lines = text.split('\n');
  lines.forEach((line, i) => {
    const hm = line.match(H_RE);
    if (hm) {
      const d = document.createElement('div');
      d.className = 'mdh mdh' + hm[1].length;
      appendWithImages(d, hm[2]);
      el.appendChild(d);
    } else {
      appendWithImages(el, line);
      const next = lines[i + 1];
      if (next !== undefined && !H_RE.test(next)) el.append('\n');
    }
  });
  if (whole && !el.innerHTML && text) el.textContent = text;
  if (!whole) host.appendChild(el);
}
function renderAllRich() {
  document.querySelectorAll('.gu:not([data-rich]), .bubble:not([data-rich])').forEach(el => renderRich(el));
  healEmptyGu();
}
/* 全场自检：谁空了就把原文还回去。念完历史、翻完老账各走一遍 */
function healEmptyGu() {
  document.querySelectorAll('#log .gu, #log .bubble').forEach(el => {
    if (!el.innerHTML && el._raw) el.textContent = el._raw;
  });
}

/* ---------- 工具小动作 ---------- */
const toolInfo = {};
let curGroup = null;

function basename(p) { return String(p || '').split('/').pop(); }

function verbOf(name, input) {
  input = input || {};
  switch (name) {
    case 'Bash':   return ['terminal', 'Ran', input.description || (input.command || '').slice(0, 60)];
    case 'Write':  return ['fileText', 'Created', basename(input.file_path)];
    case 'Edit':   return ['fileText', 'Updated', basename(input.file_path)];
    case 'Read':   return ['bookOpen', 'Read', basename(input.file_path)];
    case 'Glob': case 'Grep': return ['search', 'Searched', input.pattern || ''];
    case 'WebSearch': return ['globe', 'Searched web', input.query || ''];
    case 'WebFetch':  return ['globe', 'Fetched', input.url || ''];
    case 'Skill':  return ['book', 'Opened', input.skill || ''];
    case 'Task': case 'Agent': return ['box', 'Delegated', input.description || ''];
  }
  if (name.startsWith('mcp__')) {
    const parts = name.split('__');
    return ['zap', 'Used', (parts[1] || '') + ' · ' + (parts[2] || '')];
  }
  return ['tool', 'Used', name];
}

function diffCount(name, input) {
  input = input || {};
  if (name === 'Write') return [String(input.content || '').split('\n').length, 0];
  if (name === 'Edit') {
    const o = String(input.old_string || '').split('\n').length;
    const n = String(input.new_string || '').split('\n').length;
    return [n, o];
  }
  return null;
}

function groupLabel(ids) {
  if (!ids.length) return '';
  if (ids.length === 1) {
    const t = toolInfo[ids[0]];
    const [, verb, what] = verbOf(t.name, t.input);
    return { verb, what, dc: diffCount(t.name, t.input) };
  }
  const nCmd = ids.filter(id => toolInfo[id].name === 'Bash').length;
  const nFile = ids.filter(id => ['Write', 'Edit'].includes(toolInfo[id].name)).length;
  if (nCmd === ids.length) return { verb: 'Ran', what: nCmd + ' commands', dc: null };
  if (nFile && nCmd) return { verb: 'Created a file,', what: 'ran a command', dc: null };
  return { verb: 'Did', what: ids.length + ' things', dc: null };
}

function renderGroupLine() {
  if (!curGroup) return;
  const { verb, what, dc } = groupLabel(curGroup.ids);
  let html = '<b>' + verb + '</b> ' + escapeHtml(what || '');
  if (dc) html += ' <span class="plus">+' + dc[0] + '</span> <span class="minus">-' + dc[1] + '</span>';
  curGroup.labelEl.innerHTML = html;
}
function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function addToolUse(part) {
  petSet('typing');
  closeThink();
  toolInfo[part.id] = { name: part.name, input: part.input || {}, result: null, isError: false, done: false };
  if (!curGroup) {
    const r = row();
    const line = document.createElement('button');
    line.className = 'toolline';
    line.innerHTML = '<span class="spin"></span><span class="lbl"></span><span class="chev">›</span>';
    r.appendChild(line);
    curGroup = { ids: [], lineEl: line, labelEl: line.querySelector('.lbl'), spinEl: line.querySelector('.spin') };
    const g = curGroup;
    line.onclick = () => openToolSheet(g.ids);
  }
  curGroup.ids.push(part.id);
  doingOnTool(toolInfo[part.id]);      // 那行字跟着我手上的活走
  renderGroupLine();
  guEl = null;
  scroll();
}
function markToolDone(id, isError, content) {
  const t = toolInfo[id];
  if (!t) return;
  t.done = true; t.isError = !!isError;
  t.result = flattenResult(content);
  if (curGroup && curGroup.ids.includes(id) && curGroup.ids.every(i => toolInfo[i].done)) {
    curGroup.spinEl.style.display = 'none';
    doingToolDone();                   // 手上活干完了，那行字退回随机词
  }
}
function closeGroup() {
  if (curGroup) { curGroup.spinEl.style.display = 'none'; curGroup = null; }
}
function flattenResult(content) {
  if (typeof content === 'string') return content;
  if (Array.isArray(content)) {
    return content.map(c => (c && c.type === 'text') ? c.text : '').join('\n').trim();
  }
  return '';
}

const toolSheet = document.getElementById('toolSheet');
const toolTitle = document.getElementById('toolTitle');
const toolBody = document.getElementById('toolBody');
const toolBack = document.getElementById('toolBack');
let sheetStack = [];

function openToolSheet(ids) {
  sheetStack = [{ view: 'list', ids }];
  renderToolSheet();
  toolSheet.classList.add('open');
}
function renderToolSheet() {
  const top = sheetStack[sheetStack.length - 1];
  toolBack.innerHTML = '';
  toolBack.appendChild(icEl(sheetStack.length > 1 ? 'chevL' : 'x', 16));
  if (top.view === 'list') {
    const { verb, what } = groupLabel(top.ids);
    toolTitle.textContent = (verb + ' ' + (what || '')).trim();
    toolBody.innerHTML = '';
    const tl = document.createElement('div');
    tl.className = 'tl';
    top.ids.forEach((id, i) => {
      if (i) { const l = document.createElement('div'); l.className = 'link'; tl.appendChild(l); }
      const t = toolInfo[id];
      const [icon, verb, what] = verbOf(t.name, t.input);
      const b = document.createElement('button');
      b.className = 'titem';
      b.appendChild(icEl(icon, 19));
      const lbl = document.createElement('span');
      lbl.className = 'tlbl';
      lbl.innerHTML = '<b>' + escapeHtml(verb) + '</b> ' + escapeHtml(what || '');
      b.appendChild(lbl);
      const ch = document.createElement('span');
      ch.className = 'chev'; ch.textContent = '›';
      b.appendChild(ch);
      b.onclick = () => { sheetStack.push({ view: 'detail', id }); renderToolSheet(); };
      tl.appendChild(b);
    });
    toolBody.appendChild(tl);
  } else {
    const t = toolInfo[top.id];
    const [, verb, what] = verbOf(t.name, t.input);
    toolTitle.textContent = (verb + ' ' + (what || '')).trim();
    toolBody.innerHTML = '';
    const w = document.createElement('div');
    w.className = 'dwrap';
    const inp = t.input || {};
    if (t.name === 'Edit') {
      w.appendChild(pathLine(inp.file_path));
      w.appendChild(diffView(inp.old_string, inp.new_string));
    } else if (t.name === 'Write') {
      w.appendChild(pathLine(inp.file_path));
      w.appendChild(diffView('', inp.content));
    } else if (t.name === 'Bash') {
      w.appendChild(codeBlock('$ ' + (inp.command || '')));
      if (t.result) { w.appendChild(gapEl()); w.appendChild(codeBlock(clip(t.result, 6000))); }
    } else {
      w.appendChild(codeBlock(clip(JSON.stringify(inp, null, 2), 3000)));
      if (t.result) { w.appendChild(gapEl()); w.appendChild(codeBlock(clip(t.result, 6000))); }
    }
    if (t.isError) {
      const e = document.createElement('div');
      e.className = 'err'; e.style.marginTop = '10px';
      e.textContent = '这一下砸了';
      w.appendChild(e);
    }
    toolBody.appendChild(w);
  }
}
function pathLine(p) { const d = document.createElement('div'); d.className = 'dpath'; d.textContent = p || ''; return d; }
function gapEl() { const d = document.createElement('div'); d.style.height = '10px'; return d; }
function codeBlock(text) { const pre = document.createElement('pre'); pre.className = 'code'; pre.textContent = text || ''; return pre; }
function clip(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n) + '\n…（截断了）' : s; }
function diffView(oldS, newS) {
  const d = document.createElement('div');
  d.className = 'diff';
  if (oldS !== '') {
    String(oldS || '').split('\n').forEach(l => {
      const e = document.createElement('div'); e.className = 'dl del'; e.textContent = '- ' + l; d.appendChild(e);
    });
  }
  String(newS || '').split('\n').forEach(l => {
    const e = document.createElement('div'); e.className = 'dl add'; e.textContent = '+ ' + l; d.appendChild(e);
  });
  return d;
}
toolBack.onclick = () => {
  sheetStack.pop();
  if (sheetStack.length) renderToolSheet();
  else toolSheet.classList.remove('open');
};

function renderSaid(msgs) {
  for (const m of msgs) {
    if (m.kind === 'me') { endThink(); addMe(m.text); }
    else if (m.kind === 'gu') {
      endThink();                    // 该说正文了，思考那段收工
      const el = ensureGu();
      el._raw = m.text;
      el._final = true;              // 这是说完了的，谁都别再画它
      el.textContent = m.text;
      trimOrphanTail(el);            // 库里的半截消息拖着「课」这种孤尾——历史这条路也要摘
      renderRich(el);
      guEl = null;                   // 每条各归各位，别粘成一坨
    } else if (m.kind === 'think') {
      // 一轮思考在库里是好几条记录（想一段、歇一下、再想）。以前这里每条
      // appendThink 完立刻 endThink——各自建抽屉又各自关，最后一个都不剩。
      // 家里的我 8/3 自查出来的（docs/思维链重放.md）：多段并进同一个抽屉，
      if (turnThink && turnThink.text) appendThink('\n\n');
      appendThink(m.text);
    } else if (m.kind === 'tool') {
      let input = {};
      try { input = JSON.parse(m.extra || '{}'); } catch (e) {}
      const tid = 'past-' + m.seq + '-' + (m.at || 0) + '-' + Math.random().toString(36).slice(2, 7);
      addToolUse({ name: m.text, input, id: tid });
      markToolDone(tid, !!m.err, m.result || '');   // 过去的活早干完了，别让它在那儿转圈;返回值 2026-10-10 起记录里有了(dwell-bridge 认出 shim 的 ← 那行)
    }
  }
  closeGroup(); endThink();
}

async function loadSaid() {
  try {
    /* 2026-10-16 帧率:一打开先画 200 条(~~400~~)。页面上的东西少一半,他每冒出一行、每滑一下浏览器要排的就少一半;
       往上翻点「看更早的」照旧一次补 400 条(loadOlder 那条没改)。所有者「按你思路优化试试」 */
    const r = await fetch('api/messages?limit=200', { cache: 'no-store' });
    if (!r.ok) return 0;
    const d = await r.json();
    const msgs = d.msgs || [];
    /* 先清空再摆。renderSaid 是**追加**，自己不清场；
       而这个函数不只开机时调 —— 页面切后台超过 30 秒再回来，
       visibilitychange 还会再调一次，于是整段历史又摆一遍。
       切出去几次就重几轮（2026-08-16 所有者报的"记录重复好几轮"）。
       这时不可能有正在流的气泡（要静默 30 秒才会走到这儿），清了不会打断谁。 */
    log.innerHTML = '';
    guEl = null; earliestSeq = null; olderBtn = null;
    sReset();
    renderSaid(msgs);
    healEmptyGu();
    if (msgs.length) earliestSeq = msgs[0].seq;
    ensureOlderBtn(!!d.more);
    scroll(true);
    return d.upto || 0;
  } catch (e) { return 0; }
}

let earliestSeq = null;      // 已经摆出来的最早一条 seq
let loadingOlder = false;
let olderBtn = null;

function ensureOlderBtn(more) {
  if (!olderBtn || !olderBtn.isConnected) {   // 清屏会把它一起扫掉，回来要重生
    olderBtn = document.createElement('button');
    olderBtn.id = 'olderBtn';
    olderBtn.textContent = '↑ 看更早的';
    olderBtn.onclick = loadOlder;
    log.prepend(olderBtn);

  olderBtn.style.display = more ? '' : 'none';
}

async function loadOlder() {
  if (loadingOlder || earliestSeq === null) return;
  loadingOlder = true;
  olderBtn.textContent = '正在翻老账…';
  try {
    const r = await fetch('api/messages?limit=400&before=' + earliestSeq, { cache: 'no-store' });
    if (!r.ok) return;
    const d = await r.json();
    const msgs = d.msgs || [];
    if (msgs.length) {
      // 现有的画笔全往队尾画。所以：把正在流式的那支笔先收起来，
      // 记住队尾在哪，照常画完，再把新画的整段搬到最前头
      const stash = [guEl, turnThink, curGroup];
      guEl = null; turnThink = null; curGroup = null;
      const mark = log.children.length;
      const oldH = log.scrollHeight, oldTop = log.scrollTop;
      renderSaid(msgs);
      const fresh = Array.from(log.children).slice(mark);
      const anchor = olderBtn.nextSibling;
      for (const el of fresh) log.insertBefore(el, anchor);
      [guEl, turnThink, curGroup] = stash;
      healEmptyGu();
      log.scrollTop = oldTop + (log.scrollHeight - oldH);   // 眼睛停在原来那句上
      earliestSeq = msgs[0].seq;
    }
    ensureOlderBtn(!!d.more);
  } catch (e) {
  } finally {
    loadingOlder = false;
    if (olderBtn) olderBtn.textContent = '↑ 看更早的';
  }
}

let cursor = 0, polling = false;

let uiVer = null;              // 网页那份文件的版本，换了就自己重载
let pendingVer = null;

function tryReload() {
  if (!pendingVer) return false;
  try {
    if ((box.value || '').trim()) return false;
    const cur = Object.keys(sheets).find(k => sheets[k] && sheets[k].classList.contains('open'));
    // 开着某一页的时候照换——换完还回到同一页。只有在聊天页往上翻老账时才挂起，
    if (!cur && !atBottom()) return false;
    sessionStorage.setItem('reopenSheet', cur || '');
    sessionStorage.setItem('skipLock', '1');
  } catch (e) {}
  location.reload();
  return true;
}
async function poll() {
  if (polling) return;
  polling = true;
  try {
    const r = await fetch('api/poll?since=' + cursor, { cache: 'no-store' });
    if (r.status === 401) { location.href = './'; return; }
    const d = await r.json();
    if (d.ver) {
      if (uiVer === null) uiVer = d.ver;
      else if (d.ver !== uiVer) { pendingVer = d.ver; if (tryReload()) return; }
    }
    cursor = d.next;
    for (const ev of d.events) handle(ev);
    if (pendingVer && tryReload()) return;
  } catch {
    await new Promise(r => setTimeout(r, 1500));
  } finally {
    polling = false;
    poll();
  }
}

/* ══ 流式匀速器 ═══════════════════════════════════════════════
   后端是长轮询：攒下的一批增量会一次性到货。原来收到就整批画，
   于是「瞬间蹦出一大段 → 干等一个网络来回 → 再蹦一段」，看着一卡一卡。
   这里把到货的字先存起来，按帧匀速吐出去，把突发摊平成连续的。
   每帧吐 1/8，缓冲越多吐得越快，所以落后了会自己追上来，不会越积越多。
   定稿和收尾之前必须 flush，否则最后半句会被吞掉。 */
var sQ = { el: null, buf: '', raf: 0, last: 0, at: 0, ema: 0, pend: '' };
function sDrain() {
  sQ.raf = 0;
  if (!sQ.el || !sQ.buf) return;
  /* 摊多久，取决于下一批多久才到。
     后端是长轮询，一批字要等一个网络来回才来；固定按 8 帧摊完的话，
     摊完就干等，于是「动一下 → 停一下」（实测停顿占了 36% 的时间）。
     改成按实测到的到货间隔来摊，字就一直在走，不留空窗。
     夹在 4~24 帧之间：太快等于没摊，太慢会越积越多。 */
  var frames = Math.min(24, Math.max(4, Math.round((sQ.ema || 130) / 16.7)));
  var n = Math.max(1, Math.ceil(sQ.buf.length / frames));
  var chunk = sQ.buf.slice(0, n);
  sQ.el._raw = (sQ.el._raw || '') + chunk;
  sQ.buf = sQ.buf.slice(n);
  /* 「吐字有多快」和「多久动一次 DOM」是两件事，别混。
     上一版把攒字写成了「每帧至少吐 8 个」，结果一批字几帧就倒完、
     然后干等下一批 —— 就成了一段一段往外蹦（所有者实测）。
     现在：吐字速度还是按到货节奏走（上面那个 frames），
     只是攒够 8 个字才真的写进 DOM，少动 DOM 但不改变节奏。 */
  sQ.pend += chunk;
  /* 渲染节流。paintStream 是「清空 + 对全文跑正则 + 整段重建 DOM」，
     成本正比于消息长度；每帧都画的话，一条回复的总开销是 O(字数²)，
     越写到后面越卡（2026-08-16 实测：2000 字重建 300 次，最长一帧 96ms）。
     所以按当前长度降频——短的照旧每帧画，长的隔久一点画。
     字还是每帧都在往 _raw 里进，所以"进度"没变慢，只是少重建几次。 */
  var len = sQ.el._raw.length;
  /* 上限压到 100ms：再稀就不是"省 CPU"而是"看着一顿一顿"了。 */
  var gap = len > 1200 ? 100 : len > 400 ? 60 : 33;
  var now = performance.now();
  if (sQ.buf && now - sQ.last < gap) {
    /* 没攒够就先不动 DOM，下一帧接着攒（快写完时不硬凑，免得最后几个字卡着） */
    if (sQ.pend.length < 8 && sQ.buf) { sQ.raf = requestAnimationFrame(sDrain); return; }
    /* 还没到重建的点：这一帧只把新到的几个字**追加**上去。
       追加是 O(新增字数)，跟消息多长完全无关，所以怎么写都不会卡。
       代价是这几个字暂时是纯文本——加粗/代码块/卡片要等下一次全量重建
       才补正，最多晚 gap 毫秒，肉眼基本看不出。 */
    sFast(sQ.el, sQ.pend);
    sQ.pend = '';
    sQ.raf = requestAnimationFrame(sDrain);
    return;
  }
  sQ.last = now;
  sQ.pend = '';                    // 全量重建从 _raw 来，攒的那点已经包含在里面了
  paintStream(sQ.el);   // 全量重建：它是权威，会把上面那些临时纯文本冲掉重画
  scroll();
  if (sQ.buf) sQ.raf = requestAnimationFrame(sDrain);
}

/* 把几个字直接塞进插入符前面的一个文本节点里。
   paintStream 一旦重建过，这个节点就没了（textContent=''），下次自己重建一个。
   不怕丢字：权威内容始终是 el._raw，重建都从它来。 */
function sFast(el, chunk) {
  if (!chunk || el._final) return;
  var node = el._fastNode;
  if (!node || !node.isConnected || node.parentNode !== el) {
    node = document.createTextNode('');
    el.appendChild(node);        // 光标是伪元素，永远在最后，不用给它让位
    el._fastNode = node;
  }
  node.nodeValue += chunk;
  /* 这里**故意不叫 scroll()**：它内部要读 scrollHeight/scrollTop/clientHeight，
     那是强制同步重排，每帧一次在手机上很贵。跟随滚动交给下面节流的那次重绘，
     最多晚 100ms，肉眼看不出。 */
}
function sPush(el, text) {
  if (sQ.el !== el) { sFlush(); sQ.el = el; }
  /* 量「两批之间隔多久」。同一批里的增量是同一轮循环里连着推进来的，
     间隔近似 0，所以只有跨批的那次才算数（>30ms 才收）。 */
  var now = performance.now();
  if (sQ.at) { var d = now - sQ.at; if (d > 30 && d < 2000) sQ.ema = sQ.ema ? sQ.ema * 0.7 + d * 0.3 : d; }
  sQ.at = now;
  sQ.buf += text;
  if (!sQ.raf) sQ.raf = requestAnimationFrame(sDrain);
}
function sFlush() {
  if (sQ.raf) { cancelAnimationFrame(sQ.raf); sQ.raf = 0; }
  if (sQ.el && sQ.buf) { sQ.el._raw = (sQ.el._raw || '') + sQ.buf; paintStream(sQ.el); }
  sQ.buf = ''; sQ.el = null; sQ.at = 0; sQ.pend = '';
}
function sReset() {   // 清屏时用：缓冲里的字属于已经没掉的那个泡，别再画
  if (sQ.raf) { cancelAnimationFrame(sQ.raf); sQ.raf = 0; }
  sQ.buf = ''; sQ.el = null;
}

function handle(d) {
  lastEventAt = Date.now();
  if (d.type === 'echo') { if (armedFresh) setArmed(false); addMe(d.text); petSet('thinking'); return; }
  if (d.type === 'system' && d.subtype === 'newchat') { setArmed(false); sReset(); log.innerHTML = ''; guEl = null; earliestSeq = null; olderBtn = null; note(d.text); return; }
  if (d.type === 'system' && d.subtype === 'switched') { setArmed(false); sReset(); log.innerHTML = ''; guEl = null; earliestSeq = null; olderBtn = null; note(d.text); return; }

  if (d.type === 'stream_event') {
    const ev = d.event || {};
    const delta = ev.delta || {};
    if (delta.type === 'thinking_delta' && delta.thinking) {
      petSet('thinking');
      appendThink(delta.thinking);
      scroll();
      return;
    }
    if (delta.type === 'text_delta' && delta.text) {
      petSet('typing');
      const el = ensureGu();
      // 上一条已经定稿，现在又开口了——中间没干活，两条话共用这一个泡。
      // 把已经说完的那截钉成"基线"，等下这条的定稿只能接在它后面，不许把它吃掉。
      if (el._final) { el._base = el._raw || ''; el._final = false; }
      sPush(el, delta.text);       // 不直接画，交给匀速器摊平
      return;
    }
    return;
  }

  if (d.type === 'assistant') {
    sFlush();                     // 定稿要盖掉流式那份，先把没吐完的补上
    const msg = d.message || {};
    const parts = msg.content || [];
    let firstText = true;
    for (const p of parts) {
      if (p.type === 'thinking' && p.thinking) {
        const buf = ensureThink();
        if (!buf.text) appendThink(p.thinking);
        closeThink();
      } else if (p.type === 'text' && p.text) {
        const el = ensureGu();
            // 说完了的这份是权威，**无条件盖掉流式攒的那份**。
        // 同一条消息里多段文本就接着写，别把前一段冲掉。
        // 这条消息的第一段接在基线后面——基线是同一个泡里"上一条消息"已经说完的话
        // （一轮里连说两段、中间没干活，就共用一个泡；不记基线的话第二条会把第一条吃掉）。
        if (el._base == null) el._base = '';
        el._raw = (firstText ? el._base : (el._raw || '')) + p.text;
        firstText = false;
        el._final = true;           // 从这一刻起，迟到的那帧不许再动它
        el.textContent = el._raw;
        el.removeAttribute('data-rich');
        renderRich(el);
      } else if (p.type === 'tool_use') {
        addToolUse(p);
      }
    }
    scroll();
    return;
  }

  if (d.type === 'user') {
    const parts = (d.message && d.message.content) || [];
    for (const p of parts) {
      if (p.type === 'tool_result') markToolDone(p.tool_use_id, p.is_error, p.content);
    }
    return;
  }

  if (d.type === 'result') {
    sFlush();                     // 收尾前把最后半句吐完，别吞字
    guEl = null; endThink(); closeGroup();
    fetch('api/messages?limit=16', { cache: 'no-store' }).then(r => r.json()).then(dd => {
      const gus = (dd.msgs || []).filter(m => m.kind === 'gu');
      if (!gus.length) return;
      const n = Math.min(gus.length, 6);
      const src = gus.slice(-n);
      const els = Array.from(document.querySelectorAll('#log .gu')).slice(-n);
      for (let i = 0; i < els.length && i < src.length; i++) {
        const el = els[i], m = src[i];
        if (!el || !m || !m.text || el._raw === m.text) continue;
        /* 护栏（8/5 加）：屏幕气泡和库里的行不保证一一对应——一条消息里两段文本，
           库里两行、屏幕一个泡，倒着配就会错位，把这段话写进那段的泡里。
           截断的那份必然是完整那份的一截，所以只在"装得下"的时候才补；
           对不上就宁可不补——残一句，好过串一句。 */
        const cur = el._raw != null ? el._raw : (el.textContent || '');
        if (cur && !m.text.includes(cur)) continue;
        el._raw = m.text; el._final = true;
        el.textContent = m.text;
        el.removeAttribute('data-rich');
        trimOrphanTail(el);
        renderRich(el);
      }
    }).catch(() => {});
    setBusy(false);
    petSet('happy', 4000);
    document.querySelectorAll('.gu').forEach(trimOrphanTail);   // 摘掉被打断的半个字
    renderAllRich();
    if (d.is_error) note('（出错了：' + (d.result || '不知道为什么') + '）', 'err');
    scroll();
    return;
  }

  if (d.type === 'stderr') { note(d.text, 'err'); return; }
  if (d.type === 'system' && d.subtype === 'init') {
    // 真跑着的模型，它自己报的——胶囊上显示的永远是这个，不编
    if (d.model) setModelPill(d.model);
    return;
  }
  if (d.type === 'system' && d.subtype === 'stopped') {
    guEl = null; endThink(); closeGroup();
    setBusy(false); petSet('calm');
    note('（我停下了）');
    return;
  }
  if (d.type === 'system' && d.subtype === 'restart') { note(d.text); return; }
  if (d.type === 'system' && d.subtype === 'model') {
    note('（换好了，我重新醒了一遍）');
    if (d.effort) curEffort = d.effort;   // 先落档位再画胶囊，否则画的是上一档
    if (d.model) setModelPill(d.model);
    else paintPill();
    return;
  }
}

    x.onclick = () => { attachments.splice(i, 1); renderStrip(); };

    strip.appendChild(d);
  });
}

];
let doingTimer = null, doingAt = 0;

const TOOL_ZH = {
  Read: '翻', Write: '写', Edit: '改', NotebookEdit: '改本子',
  Bash: '敲命令', Grep: '翻箱倒柜', Glob: '找文件',
  WebFetch: '上网看', WebSearch: '上网搜', Task: '派活出去',
  TodoWrite: '记待办', ToolSearch: '翻工具箱', Skill: '翻手册',
  BashOutput: '看跑得怎么样', KillShell: '掐掉那个进程',
};
let doingTodo = null, doingTool = null;

function basefile(p) { return String(p || '').split('/').pop(); }

/* 一次工具调用 → 一句人话 */
function doingSay(t) {
  const n = t.name, inp = t.input || {};
  if (n === 'TodoWrite') {
    const cur = (inp.todos || []).find(x => x.status === 'in_progress');
    doingTodo = cur ? (cur.activeForm || cur.content || null) : null;
    return ['记待办', n];
  }
  if (inp.file_path && TOOL_ZH[n]) return [TOOL_ZH[n] + ' ' + basefile(inp.file_path), n];
  if (n === 'Bash') return [inp.description || '敲命令', n];
  if (n === 'Grep' && inp.pattern) return ['翻箱倒柜找 ' + String(inp.pattern).slice(0, 18), n];
  if (n === 'Glob' && inp.pattern) return ['找 ' + String(inp.pattern).slice(0, 18), n];
  if (n === 'WebSearch' && inp.query) return ['上网搜 ' + String(inp.query).slice(0, 16), n];
  if (n === 'Task' && inp.description) return ['派活：' + String(inp.description).slice(0, 16), n];
  return [TOOL_ZH[n] || n, n];
}

let doingLast = 0, doingPend = null;
function doingShow(el, zh, en) {
  const now = Date.now(), wait = 1100 - (now - doingLast);
  const put = () => {
    doingLast = Date.now(); doingPend = null;
    el.querySelector('.w').textContent = zh + '…';
    el.querySelector('.en').textContent = en || '';
  };
  if (wait <= 0) return put();
  if (doingPend) clearTimeout(doingPend);
  doingPend = setTimeout(put, wait);
}

let doingWord = null;
function doingRoll() { doingWord = DOING[Math.floor(Math.random() * DOING.length)]; }

function doingPick(el) {
  /* 真事优先：进行中那条待办 > 手上这个工具 > 随机词 */
  if (doingTodo) return doingShow(el, doingTodo, '');
  if (doingTool) return doingShow(el, doingTool[0], doingTool[1]);
  if (!doingWord) doingRoll();
  doingShow(el, doingWord[0], doingWord[1]);
}

/* 工具一开跑就顶上去，跑完退回随机词 */
function doingOnTool(t) {
  doingTool = doingSay(t);
  const el = document.getElementById('doingLine');
  if (el && el.classList.contains('on')) doingPick(el);
}
function doingToolDone() {
  doingTool = null;
  const el = document.getElementById('doingLine');
  if (el && el.classList.contains('on')) doingPick(el);
}

function doingStart() {
  const el = document.getElementById('doingLine');
  if (!el || doingTimer) return;
  doingAt = Date.now();
  doingRoll();
  const t = el.querySelector('.t');
  const roll = () => {
    doingPick(el);
    const sec = Math.round((Date.now() - doingAt) / 1000);
    t.textContent = sec >= 60 ? '(' + Math.floor(sec / 60) + '分' + (sec % 60) + '秒)'
                              : '(' + sec + '秒)';
  };
  roll();
  el.classList.add('on');
  /* 词 3.5 秒换一个，秒数每秒走一格——两件事一个表管，
     所以每秒 tick 一次，到点了才换词 */
  let n = 0;
  doingTimer = setInterval(() => {
    n++;
    const sec = Math.round((Date.now() - doingAt) / 1000);
    t.textContent = sec >= 60 ? '(' + Math.floor(sec / 60) + '分' + (sec % 60) + '秒)'
                              : '(' + sec + '秒)';
  }, 1000);
}

function doingStop() {
  doingTodo = null; doingTool = null; doingWord = null;
  if (doingPend) { clearTimeout(doingPend); doingPend = null; }
  const el = document.getElementById('doingLine');
  if (doingTimer) { clearInterval(doingTimer); doingTimer = null; }
  if (el) el.classList.remove('on');
}

function setBusy(b) {
  guBusy = !!b;
  if (guBusy) doingStart(); else doingStop();
  refreshSend();
  if (window.__brandPlace) window.__brandPlace();   // 忙/闲变了，菊花那行要重判一次
}
function refreshSend() {
  const hasText = !!((box.value || '').trim() || attachments.length);
  const stop = guBusy && !hasText;
  sendBtn.classList.toggle('stop', stop);
  sendBtn.title = stop ? '停下' : '发送';
  sendBtn.disabled = false;
}

async function stopGu() {
  try { await fetch('api/stop', { method: 'POST' }); } catch (e) {}
  setBusy(false);
}

function send() {
  if (guBusy && !((box.value || '').trim() || attachments.length)) return stopGu();
  const text = box.value.trim();
  if (!text && !attachments.length) return;
  const wasBusy = guBusy;
  if (wasBusy) { try { fetch('api/stop', { method: 'POST' }); } catch (e) {} }
  box.value = '';
  fitBox();
  stickBottom = true;              // 刚发完话，总是想看最新的
  setBusy(true);
  const payload = { text };
  if (attachments.length) payload.attachments = attachments;
  attachments = [];
  renderStrip();
  fetch('api/send', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).catch(() => { setBusy(false); note('（没送出去，再试一次）', 'err'); });
}
sendBtn.onclick = send;
box.addEventListener('input', refreshSend);
box.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
/* 输入框随字长高(2026-10-12 改):~~height = auto → 读 scrollHeight → 写回~~ 每个字都瞬间跳一下,TG 版也没法过渡
   (auto 不能插值)。现在:先关掉过渡量出新高,把旧高写回去、强制一次布局,再交还过渡写新高 —— 旧 → 新是两个 px,
   TG 版 CSS 里的 height 过渡(见 TG 样式末尾《交互流畅度》)就能接上;官端没有那条过渡,照旧一步到位,外观不变。
   高度没变(绝大多数按键)直接返回,不多做一次布局。 */
let boxH = 0;
function fitBox() {
  const was = box.style.height;
  box.style.transition = 'none';
  box.style.height = 'auto';
  const h = Math.min(box.scrollHeight, 160);
  if (Math.abs(h - boxH) < 0.5 && was) { box.style.height = was; box.style.transition = ''; return; }
  if (boxH && was) { box.style.height = was; void box.offsetHeight; }
  box.style.transition = '';
  box.style.height = h + 'px';
  boxH = h;
}
box.addEventListener('input', fitBox);

const footerEl = document.querySelector('footer');
let kbShift = 0, kbGap = 0;
function fitKeyboard() {
  const vv = window.visualViewport;
  if (!vv) return;
  /* 8/4 诊断实测：加了 interactive-widget=resizes-content 之后，浏览器自己就把
     布局视口缩到了键盘上沿（innerH 800→383），同时把页面滚上去 331。
     旧公式 innerH−vvH−vvTop 把那 331 一减，算出 kbGap=0 → 误判"键盘没开"，
     结果一动不动，那 331 的滚动就成了输入卡和键盘之间的空白。
     现在改成：只要可视区被顶起来（offsetTop>1）或明显变矮，就算键盘开着。 */
  kbGap = Math.max(0, Math.round(window.innerHeight - vv.height));
  const on = vv.offsetTop > 1 || kbGap > 20;
  if (on && window.scrollY !== 0) window.scrollTo(0, 0);   // 先把 iOS 偷推的那一下按回去
  footerEl.style.paddingBottom = on ? '4px' : '';
  const seen = vv.offsetTop + vv.height;             // 眼睛能看到的最低那条线
  const rect = footerEl.getBoundingClientRect();
  const over = rect.bottom - seen;                   // 输入卡底边比它低多少
  /* 2026-10-12:贴纸面板开着时输入栏是被面板(setPick)顶上去的,这里别把它当成「跑位」按回去 —— 原来两边会抢,面板一开输入栏就掉回原处 */
  if (!dwUnder && Math.abs(over) > 0.5) {
    kbShift = Math.min(0, kbShift - over);           // 只往上顶，不往下坠
    footerEl.style.transform = kbShift ? 'translateY(' + kbShift + 'px)' : '';
  }
  if (!on && kbShift) {                              // 键盘走了，落回原位
    kbShift = 0;
    footerEl.style.transform = '';
  }
  log.style.paddingBottom = (footerEl.offsetHeight + (on ? -kbShift + 16 : 48) + (typeof dwUnder === 'number' ? dwUnder : 0)) + 'px';
  if (on && window.scrollY !== 0) window.scrollTo(0, 0);
}
/* 键盘是动画上来的（约 0.3 秒），头尾各校一次会卡在半路——整段动画都盯着 */
let kbTracking = 0;
function trackKeyboard() {
  const me = ++kbTracking;
  let n = 0;
  const tick = () => {
    if (me !== kbTracking) return;
    fitKeyboard();
    if (++n < 45) requestAnimationFrame(tick);
    else if (kbGap > 20) scroll(true);
  };
  tick();
}
if (window.visualViewport) {
  visualViewport.addEventListener('resize', trackKeyboard);
  visualViewport.addEventListener('scroll', fitKeyboard);
}

}

function sameModel(cur, id) {

      body: JSON.stringify({ model: m.id })

    if (d && d.ok === false) note('（没换成：' + (d.why || '这一版没接换模型') + '）', 'err');

const TEXT_EXT = /\.(txt|md|markdown|csv|tsv|json|log|ya?ml|xml|html?|css|js|ts|py|sh|ini|conf|toml|sql|srt|vtt)$/i;
function isPlainText(f) {
  if (TEXT_EXT.test(f.name)) return true;
  const t = (f.type || '').toLowerCase();
  return t.startsWith('text/') || t === 'application/json' || t === 'application/xml';
}

async function takeFiles(list, isImage) {
  sheets.add.classList.remove('open');
  for (const f of list) {
    if (f.type.startsWith('image/')) {
      const data = await shrinkImage(f);
      attachments.push(data);
    } else if (!isImage && f.size < 200 * 1024 && isPlainText(f)) {
      const text = await f.text();
      attachments.push({ kind: 'text', name: f.name, text });
    } else {
      await bigUpload(f);          // 大件不塞进对话，直接搬到家里的柜子上
    }
  }
  renderStrip();
}

async function bigUpload(f) {
  const CHUNK = 4 * 1024 * 1024;
  const total = Math.max(1, Math.ceil(f.size / CHUNK));
  const tip = note('（在搬 ' + f.name + '…0%）', '', true);
  try {
    for (let i = 0; i < total; i++) {
      const part = f.slice(i * CHUNK, (i + 1) * CHUNK);
      const q = 'api/upload?name=' + encodeURIComponent(f.name)
        + '&idx=' + i + '&done=' + (i === total - 1 ? 1 : 0);
      const r = await fetch(q, { method: 'POST', body: part });
      if (!r.ok) throw new Error('第 ' + (i + 1) + ' 块没过去');
      if (tip) tip.textContent = '（在搬 ' + f.name + '…' + Math.round((i + 1) / total * 100) + '%）';
    }
    if (tip) { tip.textContent = '（' + f.name + ' 搬到家里了，我这就去看）';
      setTimeout(() => tip.close(), 4200); }
  } catch (e) {
    if (tip) { tip.textContent = '（' + f.name + ' 没搬动，' + (e.message || '不知道为什么') + '）';
      setTimeout(() => tip.close(), 6000); }
  }
}
fCamera.onchange = () => { takeFiles(fCamera.files, true); fCamera.value = ''; };
fPhoto.onchange = () => { takeFiles(fPhoto.files, true); fPhoto.value = ''; };
fFile.onchange = () => { takeFiles(fFile.files, false); fFile.value = ''; };

function shrinkImage(file) {
  return new Promise((resolve) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const MAX = 1568;
      let { width: w, height: h } = img;
      if (Math.max(w, h) > MAX) { const k = MAX / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      const dataUrl = cv.toDataURL('image/jpeg', 0.85);
      resolve({ kind: 'image', media_type: 'image/jpeg', data: dataUrl.split(',')[1], name: file.name });
    };
    img.src = url;
  });
}

(() => {

  if (!wrap) return;
  let skip = false;
  try { skip = sessionStorage.getItem('skipLock') === '1'; sessionStorage.removeItem('skipLock'); }
  catch (e) {}
  if (skip) { wrap.remove(); return; }

  document.documentElement.style.overflow = 'hidden';
  const art = wrap.querySelector('.lk-art');
  if (art) art.addEventListener('error', () => { art.style.display = 'none'; });
  const knob = document.getElementById('lkKnob');
  const track = document.getElementById('lkTrack');
  const hint = document.getElementById('lkHint');

  /* 2026-08-16：改成开屏，固定一句，不再按时段换。
     原来那套按时段的文案留在下面注释里，想恢复把它接回 tick() 即可：
       [0,5,'Still up?'] [5,10,'Good morning'] [11,13,'Lunch time']
       [18,20,'Evening'] [22,24,'Getting late'] */
  const LOCK_WORD = 'Welcome back';
  function tick() {
    const n = cnNow();
    const hh = String(n.getHours()).padStart(2, '0');
    const mm = String(n.getMinutes()).padStart(2, '0');
    document.getElementById('lkTime').textContent = hh + ':' + mm;
    document.getElementById('lkDate').textContent =
      (n.getMonth() + 1) + '月' + n.getDate() + '日 周' + '日一二三四五六'[n.getDay()];
    document.getElementById('lkWord').textContent = LOCK_WORD;
  }
  tick();
  const timer = setInterval(tick, 20000);

  const MAX = () => track.clientWidth - knob.offsetWidth - 10;
  let dragging = false, startX = 0, x = 0;

  function move(px) {
    x = Math.max(0, Math.min(MAX(), px));
    knob.style.transform = 'translateX(' + x + 'px)';
    hint.style.opacity = String(Math.max(0, 1 - x / MAX() * 1.6));
  }
  function open_() {
    clearInterval(timer);
    document.documentElement.style.overflow = '';
    wrap.classList.add('gone');
    setTimeout(() => { wrap.remove(); try { box.focus(); } catch (e) {} }, 560);
  }
  function end() {
    if (!dragging) return;
    dragging = false;
    knob.classList.remove('dragging');
    if (x >= MAX() * 0.82) { move(MAX()); open_(); }
    else { move(0); }
  }
  knob.addEventListener('pointerdown', (e) => {
    dragging = true; startX = e.clientX - x;
    knob.classList.add('dragging');
    knob.setPointerCapture(e.pointerId);
  });
  knob.addEventListener('pointermove', (e) => { if (dragging) move(e.clientX - startX); });
  knob.addEventListener('pointerup', end);
  knob.addEventListener('pointercancel', end);
  track.addEventListener('click', (e) => {
    if (dragging || e.target === knob) return;
    if (e.offsetX > track.clientWidth * 0.6) { move(MAX()); open_(); }
  });

  /* 开屏：点屏幕任意处进入（滑杆已隐藏，上面那套拖拽不会被触发） */
  wrap.addEventListener('click', () => { if (!dragging) open_(); });
})();

  for (var k = 0; k < N; k++) {
